<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Painel Lotofácil - MidiaDG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { -webkit-text-size-adjust: 100%; }
        body { overflow-x: hidden; }
        .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        .scroll-x {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .scroll-x::-webkit-scrollbar { height: 6px; }
        .scroll-x::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        .scroll-x::-webkit-scrollbar-track { background: transparent; }
        input[type="number"] { font-size: 16px; }

        .aba { transition: all 0.2s; white-space: nowrap; }
        .aba.ativa {
            background: linear-gradient(135deg, #059669, #0d9488);
            color: white;
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }

        .jogo-card { transition: all 0.25s ease; cursor: pointer; }
        .jogo-card:hover { border-color: rgba(16,185,129,0.5); }
        .jogo-detalhes { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .jogo-card.expandido .jogo-detalhes { max-height: 2000px; }
        .jogo-card.expandido .seta { transform: rotate(180deg); }
        .seta { transition: transform 0.25s; display: inline-block; }

        /* Card de concurso (mesma base dos jogos, cor azulada) */
        .concurso-card { transition: all 0.25s ease; cursor: pointer; }
        .concurso-card:hover { border-color: rgba(56,189,248,0.5); }
        .concurso-card .jogo-detalhes { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .concurso-card.expandido .jogo-detalhes { max-height: 2000px; }
        .concurso-card.expandido .seta { transform: rotate(180deg); }

        .tt { position: relative; cursor: help; }
        .tt::after {
            content: attr(data-tt);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.4;
            white-space: normal;
            width: max-content;
            max-width: 240px;
            text-align: left;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 50;
        }
        .tt::before {
            content: "";
            position: absolute;
            bottom: calc(100% + 3px);
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: #334155;
            opacity: 0;
            transition: opacity 0.18s ease;
            pointer-events: none;
            z-index: 51;
        }
        .tt:hover::after, .tt:hover::before,
        .tt:focus::after, .tt:focus::before,
        .tt.ativo::after, .tt.ativo::before {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .tt-baixo::after { bottom: auto; top: calc(100% + 8px); }
        .tt-baixo::before {
            bottom: auto; top: calc(100% + 3px);
            border-top-color: transparent; border-bottom-color: #334155;
        }
        .tt-esq::after { left: 0; transform: translateX(0) translateY(4px); }
        .tt-esq::before { left: 12px; transform: translateX(0); }
        .tt-esq:hover::after, .tt-esq.ativo::after { transform: translateX(0) translateY(0); }
        .tt-esq:hover::before, .tt-esq.ativo::before { transform: translateX(0); }

        @media (max-width: 640px) {
            .tt::after { max-width: 200px; font-size: 11px; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans safe-bottom">
    <div class="w-full max-w-5xl mx-auto px-3 sm:px-4 md:px-6 py-4 md:py-8 space-y-4 md:space-y-6">

        <header class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 shadow-xl">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div class="min-w-0">
                    <h1 class="text-lg sm:text-xl md:text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent text-center sm:text-left">
                        Painel Lotofácil
                    </h1>
                    <p id="info-concursos" class="text-slate-400 text-xs sm:text-sm mt-1 text-center sm:text-left truncate">
                        Carregando informações...
                    </p>
                </div>
                <button onclick="location.reload()"
                        class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-lg w-full sm:w-auto">
                    🔄 Atualizar
                </button>
            </div>
        </header>

        <div id="loading" class="bg-slate-800 border border-slate-700 rounded-2xl p-10 sm:p-12 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent mb-3"></div>
            <p class="text-slate-300 font-medium text-sm sm:text-base">Baixando dados da planilha e calculando...</p>
        </div>

        <div id="erro" class="hidden bg-rose-900/40 border border-rose-500 rounded-2xl p-5 sm:p-6"></div>

        <div id="main-content" class="space-y-4 md:space-y-6 hidden">

            <nav class="bg-slate-800 border border-slate-700 rounded-2xl p-2 shadow-lg">
                <div class="scroll-x">
                    <div class="flex gap-2 min-w-max" id="abas-container"></div>
                </div>
            </nav>

            <div id="painel-analise" class="space-y-4 md:space-y-6"></div>

            <section class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-slate-200">Gerador de Jogos Balanceados</h2>
                    <p id="gerador-descricao" class="text-slate-400 text-xs sm:text-sm mt-1">
                        Usa os grupos da aba ativa
                    </p>
                </div>

                <div class="flex flex-col sm:flex-row sm:items-end gap-3">
                    <div class="w-full sm:flex-1">
                        <label class="block text-xs sm:text-sm text-slate-400 mb-1">Quantidade de jogos:</label>
                        <input type="number" id="qtd-jogos" value="5" min="1" max="50"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <button onclick="gerarJogos()"
                            class="w-full sm:w-auto bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white px-6 py-2.5 rounded-xl font-medium transition shadow-lg">
                        ✨ Gerar Jogos
                    </button>
                </div>

                <!-- CHECKBOX: FIXAR 7 FIBONACCI -->
                <label class="flex items-start gap-3 bg-yellow-900/20 border border-yellow-500/40 rounded-xl p-3 cursor-pointer tt"
                       data-tt="Quando marcado, TODOS os jogos gerados terão obrigatoriamente as 7 dezenas Fibonacci (01, 02, 03, 05, 08, 13, 21). Os outros 8 números vêm dos grupos A/C/B normalmente.">
                    <input type="checkbox" id="fixar-fibonacci" class="w-5 h-5 mt-0.5 accent-yellow-500 cursor-pointer">
                    <div class="min-w-0">
                        <div class="text-sm font-bold text-yellow-300">
                            🔮 Fixar 7 dezenas Fibonacci
                        </div>
                        <div class="text-xs text-slate-400 mt-0.5">
                            Garante <b>01, 02, 03, 05, 08, 13, 21</b> em todos os jogos. Os outros 8 números vêm dos grupos.
                        </div>
                    </div>
                </label>
            </section>

            <section id="jogos-container" class="space-y-3"></section>
        </div>

        <footer class="text-center text-xs text-slate-500 py-4">
            MidiaDG · Painel Lotofácil
        </footer>
    </div>

    <script src="analise.js"></script>

    <script>
        let DADOS_INJETADOS = null;
        let ABA_ATIVA = "geral";
        let jogosGerados = [];
        const FIB_FIXAS = [1, 2, 3, 5, 8, 13, 21];

        // =====================================================
        // TOOLTIPS
        // =====================================================
        document.addEventListener("click", e => {
            const alvo = e.target.closest(".tt");
            document.querySelectorAll(".tt.ativo").forEach(el => {
                if (el !== alvo) el.classList.remove("ativo");
            });
            if (alvo) {
                alvo.classList.toggle("ativo");
                e.stopPropagation();
            }
        });

        // =====================================================
        // HELPERS
        // =====================================================
        function bolinha(n, cor) {
            return `<span class="w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center rounded-full font-bold text-xs sm:text-sm shadow ${cor}">${String(n).padStart(2, '0')}</span>`;
        }
        function bolinhaMini(n, cor) {
            return `<span class="w-6 h-6 sm:w-7 sm:h-7 flex items-center justify-center rounded-full font-bold text-[10px] sm:text-xs ${cor}">${String(n).padStart(2, '0')}</span>`;
        }

        function exibirErro(msg) {
            const err = document.getElementById("erro");
            err.classList.remove("hidden");
            err.innerHTML = `<p class="text-rose-300 font-semibold">Erro:</p>
                <p class="text-rose-200 text-sm mt-1">${msg}</p>`;
            document.getElementById("loading").classList.add("hidden");
            document.getElementById("main-content").classList.add("hidden");
        }

        // =====================================================
        // ABAS
        // =====================================================
        function montarAbas() {
            const ordem = [
                { id: "geral",      label: "📊 Geral",      tt: "Análise de TODOS os concursos da planilha" },
                { id: "ultimos_30", label: "🗓️ 30 Últimos", tt: "Análise dos 30 concursos mais recentes" },
                { id: "ultimos_20", label: "🗓️ 20 Últimos", tt: "Análise dos 20 concursos mais recentes" },
                { id: "ultimos_10", label: "🗓️ 10 Últimos", tt: "Análise dos 10 concursos mais recentes" }
            ];
            const cont = document.getElementById("abas-container");
            cont.innerHTML = ordem.map(a => `
                <button class="aba tt ${a.id === ABA_ATIVA ? 'ativa' : 'bg-slate-900/60 text-slate-300 hover:bg-slate-700 border border-slate-700'} px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold"
                        data-tt="${a.tt}"
                        onclick="trocarAba('${a.id}')">
                    ${a.label}
                </button>`).join("");
        }

        function trocarAba(id) {
            ABA_ATIVA = id;
            montarAbas();
            renderizarPainel();
            jogosGerados = [];
            document.getElementById("jogos-container").innerHTML = "";
        }

        // =====================================================
        // ANÁLISE GENÉRICA (reaproveitada pra jogo e concurso)
        // =====================================================
        function analisarDezenas(dezenas, a) {
            const pares = dezenas.filter(n => n % 2 === 0).length;
            const impares = 15 - pares;

            let qtdA = 0, qtdB = 0, qtdC = 0;
            const faixas = { "01-05": 0, "06-10": 0, "11-15": 0, "16-20": 0, "21-25": 0 };
            let maiorSeq = 1, seqAtual = 1;
            let qtdFib = 0;

            for (let i = 0; i < dezenas.length; i++) {
                const n = dezenas[i];
                if (a.grupo_a.includes(n)) qtdA++;
                else if (a.grupo_b.includes(n)) qtdB++;
                else if (a.grupo_c.includes(n)) qtdC++;

                if (FIB_FIXAS.includes(n)) qtdFib++;

                if (n <= 5) faixas["01-05"]++;
                else if (n <= 10) faixas["06-10"]++;
                else if (n <= 15) faixas["11-15"]++;
                else if (n <= 20) faixas["16-20"]++;
                else faixas["21-25"]++;

                if (i > 0) {
                    if (dezenas[i] === dezenas[i-1] + 1) {
                        seqAtual++;
                        maiorSeq = Math.max(maiorSeq, seqAtual);
                    } else {
                        seqAtual = 1;
                    }
                }
            }

            const soma = dezenas.reduce((s, n) => s + n, 0);
            const mediaEsperada = a.soma_media;
            const desvio = Math.abs(soma - mediaEsperada);

            return { pares, impares, qtdA, qtdB, qtdC, faixas, soma, mediaEsperada, desvio, maiorSeq, qtdFib };
        }

        function classificarDezena(dez, a) {
            if (a.grupo_a.includes(dez)) return "A";
            if (a.grupo_c.includes(dez)) return "C";
            if (a.grupo_b.includes(dez)) return "B";
            return "?";
        }

        function corPorPontos(pts) {
            if (pts >= 15) return { cor: "text-yellow-300", bg: "bg-yellow-900/40", borda: "border-yellow-500/50", emoji: "🏆" };
            if (pts === 14) return { cor: "text-emerald-300", bg: "bg-emerald-900/40", borda: "border-emerald-500/50", emoji: "🥇" };
            if (pts === 13) return { cor: "text-teal-300", bg: "bg-teal-900/40", borda: "border-teal-500/50", emoji: "🥈" };
            if (pts === 12) return { cor: "text-sky-300", bg: "bg-sky-900/40", borda: "border-sky-500/50", emoji: "🥉" };
            return { cor: "text-slate-300", bg: "bg-slate-800/60", borda: "border-slate-600", emoji: "🎯" };
        }

        // =====================================================
        // BLOCO DE DETALHES (reaproveitado em jogo e concurso)
        // =====================================================
        function renderBlocoDetalhes(dezenas, an, a) {
            return `
                <div>
                    <div class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mb-2">
                        Distribuição por Grupo
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="bg-emerald-900/30 border border-emerald-500/40 rounded-lg py-2 tt"
                             data-tt="🔥 Quentes (A) — dezenas que mais saíram. Este conjunto tem ${an.qtdA}.">
                            <div class="text-[10px] text-emerald-300 uppercase">🔥 Quentes (A)</div>
                            <div class="text-base sm:text-lg font-bold text-emerald-200">${an.qtdA}</div>
                        </div>
                        <div class="bg-amber-900/30 border border-amber-500/40 rounded-lg py-2 tt"
                             data-tt="⚡ Intermediárias (C) — dezenas de frequência média. Este conjunto tem ${an.qtdC}.">
                            <div class="text-[10px] text-amber-300 uppercase">⚡ Interm. (C)</div>
                            <div class="text-base sm:text-lg font-bold text-amber-200">${an.qtdC}</div>
                        </div>
                        <div class="bg-rose-900/30 border border-rose-500/40 rounded-lg py-2 tt"
                             data-tt="❄️ Frias (B) — dezenas que menos saíram. Este conjunto tem ${an.qtdB}.">
                            <div class="text-[10px] text-rose-300 uppercase">❄️ Frias (B)</div>
                            <div class="text-base sm:text-lg font-bold text-rose-200">${an.qtdB}</div>
                        </div>
                    </div>
                </div>

                <div class="bg-yellow-900/20 border border-yellow-500/40 rounded-lg py-2 px-3 flex items-center justify-between tt"
                     data-tt="🔮 Fibonacci — quantas dezenas pertencem à sequência (1, 2, 3, 5, 8, 13, 21).">
                    <span class="text-[10px] sm:text-xs text-yellow-300 uppercase font-semibold">🔮 Dezenas Fibonacci</span>
                    <span class="text-sm font-bold text-yellow-200">${an.qtdFib}</span>
                </div>

                <div>
                    <div class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mb-2">
                        Distribuição por Faixas
                    </div>
                    <div class="space-y-1.5">
                        ${Object.entries(an.faixas).map(([f, v]) => `
                            <div class="flex items-center gap-2 tt"
                                 data-tt="Faixa ${f}: ${v} dezenas.">
                                <span class="text-[10px] text-slate-400 w-14 shrink-0">${f}</span>
                                <div class="flex-1 bg-slate-900/70 rounded-full h-2 overflow-hidden">
                                    <div class="bg-sky-500 h-2 rounded-full" style="width: ${(v/5)*100}%"></div>
                                </div>
                                <span class="text-[10px] text-slate-300 w-4 text-right">${v}</span>
                            </div>`).join("")}
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-slate-900/50 border border-slate-700 rounded-lg py-2 tt"
                         data-tt="Soma total das 15 dezenas = ${an.soma}.">
                        <div class="text-[10px] text-slate-400 uppercase">Soma</div>
                        <div class="text-sm font-bold text-sky-300">${an.soma}</div>
                    </div>
                    <div class="bg-slate-900/50 border border-slate-700 rounded-lg py-2 tt"
                         data-tt="Média histórica de soma do período = ${an.mediaEsperada}.">
                        <div class="text-[10px] text-slate-400 uppercase">Média Hist.</div>
                        <div class="text-sm font-bold text-slate-300">${an.mediaEsperada}</div>
                    </div>
                    <div class="bg-slate-900/50 border border-slate-700 rounded-lg py-2 tt"
                         data-tt="Desvio = |soma - média histórica| = ${an.desvio.toFixed(1)}.">
                        <div class="text-[10px] text-slate-400 uppercase">Desvio</div>
                        <div class="text-sm font-bold ${an.desvio <= 20 ? 'text-emerald-400' : 'text-amber-400'}">
                            ${an.desvio.toFixed(1)}
                        </div>
                    </div>
                </div>

                <div class="bg-slate-900/50 border border-slate-700 rounded-lg py-2 px-3 flex items-center justify-between tt"
                     data-tt="Maior sequência de dezenas CONSECUTIVAS dentro deste conjunto.">
                    <span class="text-[10px] sm:text-xs text-slate-400 uppercase">Maior sequência consecutiva</span>
                    <span class="text-sm font-bold ${an.maiorSeq >= 4 ? 'text-purple-400' : 'text-slate-300'}">
                        ${an.maiorSeq} ${an.maiorSeq === 1 ? 'dezena' : 'dezenas'}
                    </span>
                </div>
            `;
        }

        function renderBolinhasJogo(dezenas, a) {
            return dezenas.map(n => {
                const g = classificarDezena(n, a);
                const isFib = FIB_FIXAS.includes(n);
                let cor;
                if (isFib) cor = "bg-yellow-700 text-yellow-100 border-2 border-yellow-400/70";
                else if (g === "A") cor = "bg-emerald-700 text-emerald-100 border border-emerald-500/50";
                else if (g === "B") cor = "bg-rose-700 text-rose-100 border border-rose-500/50";
                else cor = "bg-amber-700 text-amber-100 border border-amber-500/50";
                return bolinha(n, cor);
            }).join("");
        }

        // =====================================================
        // PAINEL DE ANÁLISE
        // =====================================================
        function renderizarPainel() {
            const a = DADOS_INJETADOS.analises[ABA_ATIVA];
            const cont = document.getElementById("painel-analise");

            document.getElementById("gerador-descricao").textContent =
                `Grupos calculados com base: ${a.rotulo}`;

            cont.innerHTML = `
                <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4">
                    <div class="bg-slate-800/80 border border-emerald-500/30 rounded-2xl p-4 sm:p-5 shadow-lg tt tt-baixo"
                         data-tt="🔥 Grupo A — as 9 dezenas MAIS sorteadas no período.">
                        <h3 class="text-emerald-400 font-semibold text-xs sm:text-sm uppercase tracking-wider mb-3">
                            🔥 Grupo A (Quentes · 9)
                        </h3>
                        <div class="flex flex-wrap gap-2">${a.grupo_a.map(n => bolinha(n, "bg-emerald-600 text-white")).join("")}</div>
                    </div>
                    <div class="bg-slate-800/80 border border-amber-500/30 rounded-2xl p-4 sm:p-5 shadow-lg tt tt-baixo"
                         data-tt="⚡ Grupo C — as 9 dezenas INTERMEDIÁRIAS.">
                        <h3 class="text-amber-400 font-semibold text-xs sm:text-sm uppercase tracking-wider mb-3">
                            ⚡ Grupo C (Intermediárias · 9)
                        </h3>
                        <div class="flex flex-wrap gap-2">${a.grupo_c.map(n => bolinha(n, "bg-amber-600 text-white")).join("")}</div>
                    </div>
                    <div class="bg-slate-800/80 border border-rose-500/30 rounded-2xl p-4 sm:p-5 shadow-lg sm:col-span-2 lg:col-span-1 tt tt-baixo"
                         data-tt="❄️ Grupo B — as 7 dezenas MENOS sorteadas.">
                        <h3 class="text-rose-400 font-semibold text-xs sm:text-sm uppercase tracking-wider mb-3">
                            ❄️ Grupo B (Frias · 7)
                        </h3>
                        <div class="flex flex-wrap gap-2">${a.grupo_b.map(n => bolinha(n, "bg-rose-600 text-white")).join("")}</div>
                    </div>
                </section>

                <section class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3">
                    ${cardEstat("Concursos", a.n_concursos, "text-slate-200",
                        "Quantidade de concursos analisados nesta aba.")}
                    ${cardEstat("Soma Média", a.soma_media, "text-sky-400",
                        "Soma média das 15 dezenas por sorteio.")}
                    ${cardEstat("Média Pares", a.media_pares, "text-emerald-400",
                        "Média de dezenas PARES por sorteio.")}
                    ${cardEstat("Média Ímpares", a.media_impares, "text-teal-400",
                        "Média de dezenas ÍMPARES por sorteio.")}
                    ${cardEstat("Repetidas", a.media_repetidas, "text-amber-400",
                        "Média de dezenas que se REPETEM do sorteio anterior.")}
                    ${cardEstat("Mais Quente", String(a.dezena_mais_quente).padStart(2,'0'), "text-rose-400",
                        "A dezena que MAIS saiu no período.")}
                    ${cardEstat("Mais Fria", String(a.dezena_mais_fria).padStart(2,'0'), "text-blue-400",
                        "A dezena que MENOS saiu no período.")}
                    ${cardEstat("Maior Streak", a.sequencias_max, "text-purple-400",
                        "Maior número de sorteios consecutivos de uma dezena.")}
                </section>

                ${renderFibonacci(a.fibonacci)}

                <section class="bg-slate-800 border border-purple-500/40 rounded-2xl p-4 sm:p-5 shadow-lg">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 mb-3">
                        <h3 class="text-purple-400 font-semibold text-xs sm:text-sm uppercase tracking-wider tt"
                            data-tt="🔁 Sequências Ativas — dezenas que estão saindo em sorteios CONSECUTIVOS.">
                            🔁 Sequências Ativas
                        </h3>

        // =====================================================
        // 🎯 CONFERÊNCIA DE PONTOS
        // =====================================================
        function conferirJogo(dezenas) {
            const hist = DADOS_INJETADOS.historico_conferencia || [];
            const cont = { 11: 0, 12: 0, 13: 0, 14: 0, 15: 0 };
            const set = new Set(dezenas);
            let melhor = 0;
            const premiados = [];

            for (const c of hist) {
                let acertos = 0;
                for (const n of c.d) if (set.has(n)) acertos++;
                if (acertos >= 11 && acertos <= 15) {
                    cont[acertos]++;
                    if (acertos > melhor) melhor = acertos;
                    premiados.push({ c: c.c, dt: c.dt || null, pts: acertos });
                }
            }

            premiados.sort((a, b) => b.c - a.c);

            return {
                pontos: cont,
                melhor: melhor,
                totalConcursos: hist.length,
                ultimos3: premiados.slice(0, 3),
                totalPremiados: premiados.length
            };
        }

        // =====================================================
        // GERAR JOGOS (com fixar Fibonacci)
        // =====================================================
        function amostra(arr, t) {
            const copia = [...arr], res = [];
            for (let i = 0; i < t && copia.length > 0; i++) {
                const idx = Math.floor(Math.random() * copia.length);
                res.push(copia.splice(idx, 1)[0]);
            }
            return res;
        }

        function gerarJogos() {
            const a = DADOS_INJETADOS.analises[ABA_ATIVA];
            const qtd = parseInt(document.getElementById("qtd-jogos").value) || 5;
            const fixarFib = document.getElementById("fixar-fibonacci").checked;
            const container = document.getElementById("jogos-container");

            container.innerHTML = `<h3 class="text-base sm:text-lg font-bold text-slate-200 mt-2 mb-2">
                Jogos Gerados (${qtd})${fixarFib ? ' · 🔮 Fibonacci fixado' : ''}
            </h3>`;

            const unicos = new Set();
            jogosGerados = [];
            let tentativas = 0;

            if (fixarFib) {
                // =============================================
                // MODO FIXAR FIBONACCI
                // 7 dezenas fixas (Fibonacci) + 8 variáveis dos grupos
                // =============================================
                const fibSet = new Set(FIB_FIXAS);

                // Pool sem as Fibonacci, mantendo grupos A/C/B
                const poolA = a.grupo_a.filter(n => !fibSet.has(n));
                const poolC = a.grupo_c.filter(n => !fibSet.has(n));
                const poolB = a.grupo_b.filter(n => !fibSet.has(n));

                while (jogosGerados.length < qtd && tentativas < 5000) {
                    tentativas++;

                    // Tenta manter a proporção 7A + 6C + 2B → mas já temos 7 fixas
                    // Precisa distribuir 8 variáveis. Proporção: ~4A + 3C + 1B
                    // Adapta conforme pools disponíveis
                    let slots = 8;
                    let takeA = Math.min(4, poolA.length);
                    let takeC = Math.min(3, poolC.length);
                    let takeB = Math.min(1, poolB.length);

                    // Ajusta se algum pool for menor
                    while (takeA + takeC + takeB < slots) {
                        if (takeA < poolA.length && (takeA <= takeC || takeC >= poolC.length)) takeA++;
                        else if (takeC < poolC.length) takeC++;
                        else if (takeB < poolB.length) takeB++;
                        else break;
                    }

                    const sA = amostra(poolA, takeA);
                    const sC = amostra(poolC, takeC);
                    const sB = amostra(poolB, takeB);

                    const jogo = [...FIB_FIXAS, ...sA, ...sC, ...sB].sort((x, y) => x - y);

                    if (jogo.length !== 15 || new Set(jogo).size !== 15) continue;
                    const chave = jogo.join(",");
                    if (!unicos.has(chave)) {
                        unicos.add(chave);
                        jogosGerados.push({ dezenas: jogo });
                    }
                }
            } else {
                // =============================================
                // MODO NORMAL (7A + 6C + 2B)
                // =============================================
                while (jogosGerados.length < qtd && tentativas < 5000) {
                    tentativas++;
                    const sA = amostra(a.grupo_a, 7);
                    const sC = amostra(a.grupo_c, 6);
                    const sB = amostra(a.grupo_b, 2);
                    const jogo = [...sA, ...sC, ...sB].sort((x, y) => x - y);
                    if (jogo.length !== 15 || new Set(jogo).size !== 15) continue;
                    const chave = jogo.join(",");
                    if (!unicos.has(chave)) {
                        unicos.add(chave);
                        jogosGerados.push({ dezenas: jogo });
                    }
                }
            }

            jogosGerados.forEach((j, idx) => {
                container.innerHTML += renderJogoCard(j, idx, a);
            });
        }

            }

            return `
                <div class="jogo-card bg-slate-800 border border-slate-700/80 rounded-2xl p-3 sm:p-4 shadow-md"
                     id="${idUnico}"
                     onclick="toggleJogo('${idUnico}', event)">

                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-2.5">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-semibold text-slate-400 uppercase">Jogo #${String(idx + 1).padStart(2, '0')}</span>
                            <span class="text-slate-500 seta text-xs">▼</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 text-[10px] sm:text-xs font-medium">
                            <span class="tt tt-esq bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700 ${corPares}"
                                  data-tt="${ttPares}">
                                P ${an.pares} · I ${an.impares}
                            </span>
                            <span class="tt tt-esq bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700 ${corA}"
                                  data-tt="${ttA}">
                                🔥 ${an.qtdA}
                            </span>
                            <span class="tt tt-esq bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700 text-amber-400"
                                  data-tt="${ttC}">
                                ⚡ ${an.qtdC}
                            </span>
                            <span class="tt tt-esq bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700 text-rose-400"
                                  data-tt="${ttB}">
                                ❄️ ${an.qtdB}
                            </span>
                            <span class="tt tt-esq bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700 text-yellow-400"
                                  data-tt="${ttFib}">
                                🔮 ${an.qtdFib}
                            </span>
                            <span class="tt tt-esq bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700 text-sky-400"
                                  data-tt="${ttSoma}">
                                Σ ${an.soma}
                            </span>
                            <span class="tt tt-esq bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700 ${corPremio} font-bold"
                                  data-tt="${ttConf}">
                                ${txtPremio}
                            </span>
                        </div>
                    </div>

                    <div class="scroll-x">
                        <div class="flex gap-1.5 min-w-max pb-1">
                            ${renderBolinhasJogo(jogo.dezenas, a)}
                        </div>
                    </div>

                    <div class="jogo-detalhes">
                        <div class="pt-3 mt-3 border-t border-slate-700/60 space-y-3">

                            <div class="bg-slate-900/50 border border-slate-700 rounded-xl p-3">
                                <div class="flex items-center justify-between mb-2 flex-wrap gap-1">
                                    <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider">
                                        🎯 Quantas vezes este jogo teria feito...
                                    </span>
                                    <span class="text-[10px] text-slate-500">
                                        (base: ${conf.totalConcursos} concursos)
                                    </span>
                                </div>
                                <div class="grid grid-cols-5 gap-1.5 text-center">
                                    <div class="bg-yellow-900/30 border border-yellow-500/40 rounded-lg py-2 tt"
                                         data-tt="15 pontos = prêmio máximo.">
                                        <div class="text-[9px] text-yellow-300 uppercase font-bold">15 pts</div>
                                        <div class="text-base sm:text-lg font-bold text-yellow-200">${conf.pontos[15]}</div>
                                    </div>
                                    <div class="bg-emerald-900/30 border border-emerald-500/40 rounded-lg py-2 tt"
                                         data-tt="14 pontos — 1 dezena errada.">
                                        <div class="text-[9px] text-emerald-300 uppercase font-bold">14 pts</div>
                                        <div class="text-base sm:text-lg font-bold text-emerald-200">${conf.pontos[14]}</div>
                                    </div>
                                    <div class="bg-teal-900/30 border border-teal-500/40 rounded-lg py-2 tt"
                                         data-tt="13 pontos — 2 dezenas erradas.">
                                        <div class="text-[9px] text-teal-300 uppercase font-bold">13 pts</div>
                                        <div class="text-base sm:text-lg font-bold text-teal-200">${conf.pontos[13]}</div>
                                    </div>
                                    <div class="bg-sky-900/30 border border-sky-500/40 rounded-lg py-2 tt"
                                         data-tt="12 pontos — 3 dezenas erradas.">
                                        <div class="text-[9px] text-sky-300 uppercase font-bold">12 pts</div>
                                        <div class="text-base sm:text-lg font-bold text-sky-200">${conf.pontos[12]}</div>
                                    </div>
                                    <div class="bg-slate-800 border border-slate-600 rounded-lg py-2 tt"
                                         data-tt="11 pontos — mínimo que paga prêmio.">
                                        <div class="text-[9px] text-slate-300 uppercase font-bold">11 pts</div>
                                        <div class="text-base sm:text-lg font-bold text-slate-200">${conf.pontos[11]}</div>
                                    </div>
                                </div>
                                <div class="mt-2 text-[10px] sm:text-xs text-slate-400 text-center">
                                    Melhor: <b class="${corPremio}">${conf.melhor > 0 ? conf.melhor + ' pts' : 'nenhum'}</b>
                                    <span class="text-slate-500">·</span>
                                    <span class="text-slate-500">${conf.totalPremiados} premiados</span>
                                </div>
                            </div>

                            <div class="bg-slate-900/50 border border-slate-700 rounded-xl p-3">
                                <div class="flex items-center justify-between mb-2 flex-wrap gap-1">
                                    <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider">
                                        📅 Últimos 3 concursos premiados
                                    </span>
                                    <span class="text-[10px] text-slate-500">(11 pts ou mais)</span>
                                </div>
                                <div class="space-y-1.5">${ultimos3HTML}</div>
                            </div>

                            ${renderBlocoDetalhes(jogo.dezenas, an, a)}

                        </div>
                    </div>
                </div>`;
        }

        function toggleJogo(id, event) {
            if (event && event.target.closest(".tt")) return;
            const el = document.getElementById(id);
            if (el) el.classList.toggle("expandido");
        }

        // =====================================================
        // INICIAR
        // =====================================================
        async function iniciar() {
            try {
                const df = await LotofacilAPI.carregarDados();
                DADOS_INJETADOS = LotofacilAPI.analisarTudo(df);

                document.getElementById("info-concursos").textContent =
                    `${DADOS_INJETADOS.total_concursos} concursos · Último: #${DADOS_INJETADOS.ultimo_concurso}`;

                montarAbas();
                renderizarPainel();

                document.getElementById("loading").classList.add("hidden");
                document.getElementById("main-content").classList.remove("hidden");
                gerarJogos();
            } catch (e) {
                console.error(e);
                exibirErro("Falha ao carregar dados: " + e.message +
                    " — Verifique se a planilha está compartilhada como 'Qualquer pessoa com o link pode ver'.");
            }
        }

        window.onload = iniciar;
    </script>
</body>
</html>
