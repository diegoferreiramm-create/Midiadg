<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV43 - Configurações</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .config-container {
            max-width: 600px;
            margin: 20px auto;
            background: var(--white);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 86, 46, 0.15);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--pv-green-dark);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--pv-green-dark);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 86, 46, 0.1);
        }

        .btn-salvar {
            width: 100%;
            padding: 12px;
            background-color: var(--pv-green-dark);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-salvar:hover {
            background-color: var(--pv-green-light);
        }

        .tabela-usuarios {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .tabela-usuarios th {
            background: var(--pv-green-dark);
            color: white;
            padding: 8px 10px;
            text-align: left;
        }

        .tabela-usuarios td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }

        .tabela-usuarios tr:hover td {
            background: #f8fafc;
        }

        .badge-admin {
            background: #d4edda;
            color: #155724;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .badge-operador {
            background: #cce5ff;
            color: #004085;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .btn-excluir-user {
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .btn-excluir-user:hover {
            background: #c82333;
        }

        .msg-erro {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .msg-sucesso {
            color: #28a745;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .divider {
            border-top: 2px solid #eee;
            margin: 25px 0;
        }

        .info-admin {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 10px 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #856404;
        }
    </style>
</head>
<body>

    <div class="config-container">
        <div class="welcome-header">
            <h2>⚙️ Configurações</h2>
            <p id="usuario-logado-texto" style="font-size: 0.85rem; color: #555;">Carregando...</p>
        </div>

        <!-- Aviso para não-ADMIN -->
        <div id="aviso-admin" class="info-admin" style="display: none;">
            ⚠️ Apenas administradores podem cadastrar novos usuários.
        </div>

        <!-- ========================================== -->
        <!-- FORMULÁRIO DE CADASTRO DE USUÁRIO -->
        <!-- ========================================== -->
        <div id="form-cadastro-user">
            <h3 style="color: var(--pv-green-dark); margin-bottom: 15px;">➕ Cadastrar Novo Usuário</h3>

            <div id="msg-erro" class="msg-erro"></div>
            <div id="msg-sucesso" class="msg-sucesso"></div>

            <div class="form-group">
                <label>Usuário (login):</label>
                <input type="text" id="novo-usuario" placeholder="Ex: operador2" required>
            </div>

            <div class="form-group">
                <label>Senha:</label>
                <input type="password" id="nova-senha" placeholder="Digite a senha" required>
            </div>

            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" id="novo-nome" placeholder="Nome da pessoa" required>
            </div>

            <div class="form-group">
                <label>Tipo:</label>
                <select id="novo-tipo">
                    <option value="operador">👤 Operador</option>
                    <option value="admin">🔑 Administrador</option>
                </select>
            </div>

            <button class="btn-salvar" id="btn-cadastrar-user">✅ Cadastrar Usuário</button>
        </div>

        <div class="divider"></div>

        <!-- ========================================== -->
        <!-- LISTA DE USUÁRIOS CADASTRADOS -->
        <!-- ========================================== -->
        <h3 style="color: var(--pv-green-dark); margin-bottom: 15px;">📋 Usuários Cadastrados</h3>

        <div style="overflow-x: auto;">
            <table class="tabela-usuarios" id="tabela-usuarios">
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Cadastrado por</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-usuarios">
                    <tr>
                        <td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">
                            ⏳ Carregando usuários...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="menu-footer" style="margin-top: 20px;">
            <button onclick="window.location.href='menu.html'" class="btn-secondary">← Voltar ao Menu</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS - ORDEM CORRETA -->
    <!-- ========================================== -->
    <script src="api.js"></script>
    
    <!-- 🔥 LOGIN.JS TEM TODAS AS FUNÇÕES (listarUsuarios, cadastrarUsuario, excluirUsuario) -->
    <script src="login.js"></script>
    
    <!-- ========================================== -->
    <!-- CONFIGURAÇÕES - CÓDIGO EMBUTIDO AQUI -->
    <!-- ========================================== -->
    <script>
        (function() {
            'use strict';

            const nomeUsuario = localStorage.getItem('pv43_nome_usuario');
            const tipoUsuario = localStorage.getItem('pv43_tipo_usuario');

            // ==========================================
            // VERIFICA LOGIN
            // ==========================================
            if (!nomeUsuario) {
                alert('⚠️ Acesso restrito! Redirecionando para a tela de login.');
                window.location.href = 'pv43.html';
                return;
            }

            document.getElementById('usuario-logado-texto').innerText = `Logado como: ${nomeUsuario} (${tipoUsuario.toUpperCase()})`;

            if (tipoUsuario !== 'admin') {
                document.getElementById('aviso-admin').style.display = 'block';
                document.getElementById('form-cadastro-user').style.display = 'none';
            }

            // ==========================================
            // VERIFICA SE AS FUNÇÕES DO LOGIN.JS ESTÃO DISPONÍVEIS
            // ==========================================
            if (typeof window.listarUsuarios === 'undefined') {
                console.error('❌ Função listarUsuarios não encontrada! Verifique se login.js foi carregado.');
                document.getElementById('corpo-tabela-usuarios').innerHTML = 
                    '<tr><td colspan="5" style="text-align:center; padding:30px; color:#ef4444;">❌ Erro: login.js não carregado corretamente.</td></tr>';
                return;
            }

            // ==========================================
            // CARREGAR LISTA DE USUÁRIOS
            // ==========================================
            function carregarUsuarios() {
                const tbody = document.getElementById('corpo-tabela-usuarios');
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">⏳ Carregando...</td></tr>';

                // 🔥 USA A FUNÇÃO DO LOGIN.JS
                window.listarUsuarios()
                    .then(resposta => {
                        console.log('📡 Resposta listarUsuarios:', resposta);
                        if (resposta.sucesso && resposta.dados) {
                            renderizarTabela(resposta.dados);
                        } else {
                            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#ef4444;">❌ ' + (resposta.mensagem || 'Erro ao carregar usuários.') + '</td></tr>';
                        }
                    })
                    .catch(erro => {
                        console.error('❌ Erro:', erro);
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#ef4444;">❌ Erro: ' + erro.message + '</td></tr>';
                    });
            }

            function renderizarTabela(usuarios) {
                const tbody = document.getElementById('corpo-tabela-usuarios');
                
                if (!usuarios || usuarios.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">📭 Nenhum usuário cadastrado.</td></tr>';
                    return;
                }

                let html = '';
                usuarios.forEach(user => {
                    const tipoBadge = user.tipo === 'admin' 
                        ? '<span class="badge-admin">🔑 ADMIN</span>' 
                        : '<span class="badge-operador">👤 OPERADOR</span>';

                    const podeExcluir = user.usuario !== 'admin' ? 
                        `<button class="btn-excluir-user" onclick="window.excluirUsuarioHandler('${user.usuario}')">🗑️</button>` : 
                        '<span style="color:#999;font-size:0.7rem;">✖️</span>';

                    html += `
                        <tr>
                            <td><strong>${user.usuario}</strong></td>
                            <td>${user.nome || '-'}</td>
                            <td>${tipoBadge}</td>
                            <td>${user.cadastrado_por || '-'}</td>
                            <td>${podeExcluir}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            }

            // ==========================================
            // CADASTRAR USUÁRIO
            // ==========================================
            document.getElementById('btn-cadastrar-user').addEventListener('click', function() {
                const usuario = document.getElementById('novo-usuario').value.trim();
                const senha = document.getElementById('nova-senha').value.trim();
                const nome = document.getElementById('novo-nome').value.trim();
                const tipo = document.getElementById('novo-tipo').value;

                const msgErro = document.getElementById('msg-erro');
                const msgSucesso = document.getElementById('msg-sucesso');

                msgErro.style.display = 'none';
                msgSucesso.style.display = 'none';

                if (!usuario) { alert('Digite o usuário.'); return; }
                if (!senha) { alert('Digite a senha.'); return; }
                if (!nome) { alert('Digite o nome completo.'); return; }

                const loginLogado = localStorage.getItem('pv43_login_usuario') || localStorage.getItem('pv43_nome_usuario');

                this.disabled = true;
                this.innerText = 'Cadastrando...';

                // 🔥 USA A FUNÇÃO DO LOGIN.JS
                window.cadastrarUsuario(usuario, senha, nome, tipo, loginLogado)
                    .then(resposta => {
                        console.log('📡 Resposta cadastrarUsuario:', resposta);
                        if (resposta.sucesso) {
                            msgSucesso.innerText = '✅ ' + resposta.mensagem;
                            msgSucesso.style.display = 'block';
                            
                            document.getElementById('novo-usuario').value = '';
                            document.getElementById('nova-senha').value = '';
                            document.getElementById('novo-nome').value = '';
                            document.getElementById('novo-tipo').value = 'operador';

                            carregarUsuarios();
                        } else {
                            alert('❌ ' + (resposta.mensagem || 'Erro ao cadastrar usuário.'));
                        }
                    })
                    .catch(erro => {
                        console.error('❌ Erro:', erro);
                        alert('❌ Erro de comunicação: ' + erro.message);
                    })
                    .finally(() => {
                        this.disabled = false;
                        this.innerText = '✅ Cadastrar Usuário';
                    });
            });

            // ==========================================
            // EXCLUIR USUÁRIO
            // ==========================================
            window.excluirUsuarioHandler = function(usuario) {
                if (!confirm('⚠️ Tem certeza que deseja excluir o usuário "' + usuario + '"?\n\nEsta ação não pode ser desfeita!')) return;

                // 🔥 USA A FUNÇÃO DO LOGIN.JS
                window.excluirUsuario(usuario)
                    .then(resposta => {
                        console.log('📡 Resposta excluirUsuario:', resposta);
                        if (resposta.sucesso) {
                            alert('✅ Usuário excluído com sucesso!');
                            carregarUsuarios();
                        } else {
                            alert('❌ ' + (resposta.mensagem || 'Erro ao excluir'));
                        }
                    })
                    .catch(erro => alert('❌ Erro de comunicação: ' + erro.message));
            };

            // ==========================================
            // INICIALIZAR
            // ==========================================
            carregarUsuarios();

        })();
    </script>
</body>
</html>
