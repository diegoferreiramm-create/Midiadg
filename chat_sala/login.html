<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectar - Sistema de Chat Corporativo</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: hsl(230, 25%, 9%);
            --card-bg: rgba(22, 28, 45, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-color: hsl(245, 80%, 65%);
            --primary-hover: hsl(245, 80%, 60%);
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-color: hsl(280, 85%, 65%);
            --text-primary: hsl(0, 0%, 96%);
            --text-secondary: hsl(230, 15%, 70%);
            --text-muted: hsl(230, 12%, 50%);
            --input-bg: rgba(10, 12, 22, 0.5);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: hsl(245, 80%, 65%);
            --success-color: hsl(145, 80%, 45%);
            --error-color: hsl(355, 80%, 55%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, hsla(245, 80%, 60%, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, hsla(280, 85%, 60%, 0.1) 0px, transparent 50%);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Abstract shapes for premium atmosphere */
        .decor-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.35;
        }
        .circle-1 {
            width: 400px;
            height: 400px;
            background: var(--primary-color);
            top: -100px;
            left: -100px;
        }
        .circle-2 {
            width: 350px;
            height: 350px;
            background: var(--accent-color);
            bottom: -50px;
            right: -50px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 45px 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(30px) rotateX(10deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateX(0deg);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-placeholder {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border-radius: 18px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px var(--primary-glow);
            font-size: 28px;
            color: #fff;
            font-weight: 700;
        }

        .header h2 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 300;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-field-wrapper {
            position: relative;
        }

        .input-field-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            pointer-events: none;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            padding: 14px 14px 14px 44px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px var(--primary-glow),
                        inset 0 2px 4px rgba(0, 0, 0, 0.2);
            background: rgba(10, 12, 22, 0.7);
        }

        /* Buttons styling */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            box-shadow: 0 8px 24px var(--primary-glow);
            margin-bottom: 16px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px var(--primary-glow);
            filter: brightness(1.1);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--input-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: var(--text-secondary);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        /* Slide box for registration */
        .slide-box {
            display: none;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide-box.active {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .toast {
            min-width: 320px;
            max-width: 400px;
            background: rgba(18, 20, 32, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            transform: translateX(120%);
            animation: toastIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes toastIn {
            100% {
                transform: translateX(0);
            }
        }

        .toast.fadeOut {
            animation: toastOut 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes toastOut {
            0% {
                transform: translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateX(120%);
                opacity: 0;
            }
        }

        .toast-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .toast-success .toast-icon {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
        }

        .toast-error .toast-icon {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
        }

        .toast-content {
            flex-grow: 1;
        }

        .toast-title {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 2px;
        }

        .toast-msg {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Spinner for load states */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn.loading .spinner {
            display: block;
        }
        .btn.loading .btn-text {
            display: none;
        }
        .btn.loading .btn-icon {
            display: none;
        }
    </style>
</head>
<body>

    <div class="decor-circle circle-1"></div>
    <div class="decor-circle circle-2"></div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <!-- CARD LOGIN -->
        <div class="card" id="loginCard">
            <div class="header">
                <div class="logo-placeholder">⚙️</div>
                <h2>Bem-vindo de volta</h2>
                <p>Acesse o painel do chat corporativo</p>
            </div>

            <!-- Login Form -->
            <div id="loginFormBox" class="slide-box active">
                <div class="input-group">
                    <label for="loginUser">Usuário</label>
                    <div class="input-field-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <input id="loginUser" placeholder="Seu nome de usuário">
                    </div>
                </div>

                <div class="input-group">
                    <label for="loginPass">Senha</label>
                    <div class="input-field-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input id="loginPass" type="password" placeholder="Sua senha secreta">
                    </div>
                </div>

                <button class="btn btn-primary" onclick="login(this)" style="margin-top: 10px;">
                    <div class="spinner"></div>
                    <span class="btn-text">Entrar no Chat</span>
                    <svg class="btn-icon" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                    </svg>
                </button>

                <div class="divider">ou</div>

                <button class="btn btn-secondary" onclick="toggleForm('cadastro')">
                    Criar Nova Conta
                </button>
            </div>

            <!-- Cadastro Form -->
            <div id="cadastroFormBox" class="slide-box">
                <div class="input-group">
                    <label for="novoNome">Nome Completo</label>
                    <div class="input-field-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <input id="novoNome" placeholder="Ex: João Silva">
                    </div>
                </div>

                <div class="input-group">
                    <label for="novoUser">Nome de Usuário</label>
                    <div class="input-field-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <input id="novoUser" placeholder="Ex: joao.silva">
                    </div>
                </div>

                <div class="input-group">
                    <label for="novoPass">Senha de Acesso</label>
                    <div class="input-field-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input id="novoPass" type="password" placeholder="Ex: 1987">
                    </div>
                </div>

                <button class="btn btn-primary" onclick="criarConta(this)" style="margin-top: 10px;">
                    <div class="spinner"></div>
                    <span class="btn-text">Confirmar Cadastro</span>
                    <svg class="btn-icon" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>

                <div class="divider">Já tem conta?</div>

                <button class="btn btn-secondary" onclick="toggleForm('login')">
                    Fazer Login
                </button>
            </div>
        </div>
    </div>

    <script>
        // Utilizando a URL ativa do seu Web App
        const API_URL = "https://script.google.com/macros/s/AKfycbwehZdzJfw5V6tXZwpipmd8bCJWm8yYWBZt32hefUk0SweiRqGegkT8iEJ5JcBhYcoE/exec";

        // Toast de notificações
        function showToast(title, message, type = "success") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            
            const iconSvg = type === "success" 
                ? `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`
                : `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`;

            toast.innerHTML = `
                <div class="toast-icon">${iconSvg}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-msg">${message}</div>
                </div>
            `;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add("fadeOut");
                toast.addEventListener("animationend", () => {
                    toast.remove();
                });
            }, 4000);
        }

        // Troca suave entre entrar e registrar
        function toggleForm(target) {
            const loginBox = document.getElementById("loginFormBox");
            const cadastroBox = document.getElementById("cadastroFormBox");
            const cardTitle = document.querySelector(".header h2");
            const cardDesc = document.querySelector(".header p");
            const logo = document.querySelector(".logo-placeholder");

            if (target === "cadastro") {
                loginBox.classList.remove("active");
                setTimeout(() => {
                    loginBox.style.display = "none";
                    cadastroBox.style.display = "block";
                    setTimeout(() => {
                        cadastroBox.classList.add("active");
                    }, 50);
                }, 250);

                cardTitle.textContent = "Criar nova conta";
                cardDesc.textContent = "Cadastre-se para entrar na rede de chat";
                logo.textContent = "👤";
            } else {
                cadastroBox.classList.remove("active");
                setTimeout(() => {
                    cadastroBox.style.display = "none";
                    loginBox.style.display = "block";
                    setTimeout(() => {
                        loginBox.classList.add("active");
                    }, 50);
                }, 250);

                cardTitle.textContent = "Bem-vindo de volta";
                cardDesc.textContent = "Acesse o painel do chat corporativo";
                logo.textContent = "⚙️";
            }
        }

        // Ação de Login (Envia text/plain para contornar CORS)
        async function login(btnElement) {
            const user = document.getElementById("loginUser").value.trim();
            const pass = document.getElementById("loginPass").value.trim();

            if (!user || !pass) {
                showToast("Dados incompletos", "Por favor preencha usuário e senha.", "error");
                return;
            }

            btnElement.classList.add("loading");

            try {
                // Requisição Simples (Sem Preflight OPTIONS)
                const req = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({
                        acao: "login",
                        usuario: user,
                        senha: pass
                    })
                });

                const res = await req.json();

                if (res.erro) {
                    showToast("Erro de Acesso", res.erro, "error");
                    return;
                }

                if (res.sucesso) {
                    showToast("Sucesso", `Bem-vindo! Setor: ${res.setor || 'Nenhum'}`);
                    localStorage.setItem("usuario", user);
                    localStorage.setItem("setor", res.setor || "Geral");
                    
                    setTimeout(() => {
                        window.location.href = "chat.html";
                    }, 1200);
                }
            } catch (err) {
                console.error("Fetch error Details:", err);
                showToast("Erro de Rede", "Não foi possível conectar ao servidor. Verifique o salvamento e deploy do seu Apps Script.", "error");
            } finally {
                btnElement.classList.remove("loading");
            }
        }

        // Ação de Cadastro (Envia text/plain para contornar CORS)
        async function criarConta(btnElement) {
            const nome = document.getElementById("novoNome").value.trim();
            const user = document.getElementById("novoUser").value.trim();
            const pass = document.getElementById("novoPass").value.trim();

            if (!nome || !user || !pass) {
                showToast("Dados incompletos", "Por favor preencha todos os campos.", "error");
                return;
            }

            btnElement.classList.add("loading");

            try {
                // Requisição Simples (Sem Preflight OPTIONS)
                const req = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({
                        acao: "criarConta",
                        nome: nome,
                        usuario: user,
                        senha: pass
                    })
                });

                const res = await req.json();

                if (res.erro) {
                    showToast("Erro no cadastro", res.erro, "error");
                    return;
                }

                showToast("Conta criada", res.msg || "Sua conta foi criada com sucesso! Faça login.", "success");
                
                setTimeout(() => {
                    toggleForm('login');
                    document.getElementById("loginUser").value = user;
                    document.getElementById("loginPass").value = pass;
                }, 1500);

            } catch (err) {
                console.error("Fetch error Details:", err);
                showToast("Erro de Rede", "Não foi possível enviar o cadastro. Verifique a conexão.", "error");
            } finally {
                btnElement.classList.remove("loading");
            }
        }
    </script>
</body>
</html>
