<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Corporativo - Área de Trabalho</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: hsl(230, 25%, 8%);
            --sidebar-bg: rgba(18, 22, 35, 0.6);
            --chat-bg: rgba(10, 12, 22, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            
            --primary-color: hsl(245, 80%, 65%);
            --primary-hover: hsl(245, 80%, 60%);
            --primary-glow: rgba(99, 102, 241, 0.25);
            --accent-color: hsl(280, 85%, 65%);
            
            --text-primary: hsl(0, 0%, 96%);
            --text-secondary: hsl(230, 15%, 72%);
            --text-muted: hsl(230, 12%, 50%);
            
            --bubble-sent: linear-gradient(135deg, hsl(245, 80%, 65%), hsl(265, 80%, 60%));
            --bubble-received: rgba(255, 255, 255, 0.07);
            
            --input-bg: rgba(15, 18, 30, 0.7);
            --input-border: rgba(255, 255, 255, 0.08);
            --success-color: hsl(145, 80%, 45%);
            --error-color: hsl(355, 80%, 55%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(245, 80%, 60%, 0.08) 0px, transparent 40%),
                radial-gradient(at 100% 100%, hsla(280, 85%, 60%, 0.06) 0px, transparent 40%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Main Workspace Container */
        .workspace {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: rgba(20, 24, 38, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
            display: grid;
            grid-template-columns: 320px 1fr;
            overflow: hidden;
            animation: workscale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes workscale {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ================= SIDEBAR ================= */
        .sidebar {
            background: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Sidebar Profile Header */
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-avatar {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .user-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .user-info h3 {
            font-size: 15px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-info span {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-info span::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--success-color);
            border-radius: 50%;
            display: inline-block;
        }

        .logout-btn {
            background: transparent;
            border: 0;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn:hover {
            color: var(--error-color);
            background: rgba(239, 68, 68, 0.08);
            transform: scale(1.05);
        }

        /* Sidebar Contacts Search */
        .search-box {
            padding: 16px 20px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: rgba(10, 12, 22, 0.4);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 10px 12px 10px 38px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            background: rgba(10, 12, 22, 0.6);
        }

        .search-box svg {
            position: absolute;
            left: 32px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Contacts List */
        .contacts-list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0 12px 20px 12px;
        }

        .contacts-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .contacts-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }

        .contacts-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 12px 8px 8px 8px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 4px;
            border: 1px solid transparent;
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .contact-item.active {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.18);
        }

        .contact-avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
            border: 1px solid var(--card-border);
        }

        .contact-item.active .contact-avatar {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
        }

        .contact-details {
            flex-grow: 1;
            overflow: hidden;
        }

        .contact-name-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .contact-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-item.active .contact-name {
            color: white;
            font-weight: 600;
        }

        .contact-dept {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .contact-item.active .contact-dept {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: loadingSkeleton 1.5s infinite;
        }

        @keyframes loadingSkeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .contact-skeleton {
            height: 60px;
            border-radius: 14px;
            margin-bottom: 6px;
        }

        /* ================= CHAT AREA ================= */
        .chat-area {
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Empty State */
        .chat-empty {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            gap: 16px;
        }

        .chat-empty-icon {
            font-size: 54px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            color: var(--primary-color);
            animation: pulse-icon 3s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%, 100% { transform: translateY(0); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
            50% { transform: translateY(-8px); box-shadow: 0 20px 40px var(--primary-glow); }
        }

        .chat-empty h3 {
            font-size: 20px;
            font-weight: 500;
            color: white;
        }

        .chat-empty p {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 320px;
        }

        /* Active Chat UI */
        .chat-active {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* Chat Header */
        .chat-header {
            padding: 20px 24px;
            background: rgba(14, 17, 30, 0.4);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .chat-recipient-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            font-weight: 600;
            font-size: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-recipient-name {
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        .chat-recipient-status {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-recipient-status::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--success-color);
            border-radius: 50%;
            display: inline-block;
        }

        /* Chat Messages Board */
        .chat-messages-board {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-messages-board::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages-board::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        /* Message Bubble Design */
        .msg-row {
            display: flex;
            width: 100%;
        }

        .msg-row-sent {
            justify-content: flex-end;
        }

        .msg-row-received {
            justify-content: flex-start;
        }

        .msg-bubble {
            max-width: 65%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .msg-bubble-sent {
            background: var(--bubble-sent);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }

        .msg-bubble-received {
            background: var(--bubble-received);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .msg-timestamp {
            font-size: 10px;
            margin-top: 6px;
            display: block;
            text-align: right;
            opacity: 0.6;
        }

        .msg-bubble-received .msg-timestamp {
            color: var(--text-muted);
        }

        .msg-bubble-sent .msg-timestamp {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Input Controls Area */
        .chat-input-controls {
            padding: 20px 24px;
            background: rgba(14, 17, 30, 0.3);
            border-top: 1px solid var(--card-border);
        }

        .input-bar-wrapper {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 18px;
            display: flex;
            align-items: center;
            padding: 6px 6px 6px 18px;
            gap: 12px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }

        .input-bar-wrapper:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-glow),
                        inset 0 2px 4px rgba(0, 0, 0, 0.2);
            background: rgba(15, 18, 30, 0.85);
        }

        .input-bar-wrapper input {
            flex-grow: 1;
            background: transparent;
            border: 0;
            outline: none;
            color: white;
            font-size: 15px;
            padding: 10px 0;
        }

        .input-bar-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: 0;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--primary-glow);
            transition: all 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05) translateY(-1px);
            filter: brightness(1.1);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .toast {
            min-width: 300px;
            background: rgba(18, 20, 32, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            transform: translateX(120%);
            animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes toastIn { 100% { transform: translateX(0); } }

        .toast.fadeOut {
            animation: toastOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes toastOut {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(120%); opacity: 0; }
        }

        .toast-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .toast-success .toast-icon { background: rgba(16, 185, 129, 0.15); color: var(--success-color); }
        .toast-error .toast-icon { background: rgba(239, 68, 68, 0.15); color: var(--error-color); }
        .toast-content { flex-grow: 1; }
        .toast-title { font-size: 13px; font-weight: 600; color: white; }
        .toast-msg { font-size: 12px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="workspace">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <!-- Sidebar header showing current profile -->
            <div class="sidebar-header">
                <div class="user-avatar" id="myAvatar">U</div>
                <div class="user-info">
                    <h3 id="myUsername">Carregando...</h3>
                    <span id="mySector">Geral</span>
                </div>
                <button class="logout-btn" onclick="logout()" title="Sair do Chat">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>

            <!-- Contacts search bar -->
            <div class="search-box">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="contactSearch" placeholder="Pesquisar contatos..." oninput="filterContacts()">
            </div>

            <!-- Contacts list -->
            <div class="contacts-title">Contatos Disponíveis</div>
            <div class="contacts-list-container" id="contactsContainer">
                <!-- Skeletons while loading -->
                <div class="contact-skeleton skeleton"></div>
                <div class="contact-skeleton skeleton"></div>
                <div class="contact-skeleton skeleton"></div>
            </div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area" id="chatArea">
            <!-- Rendered dynamically by JavaScript -->
            <div class="chat-empty">
                <div class="chat-empty-icon">💬</div>
                <h3>Selecione um contato</h3>
                <p>Escolha um canal de conversa no painel esquerdo para iniciar a comunicação em tempo real.</p>
            </div>
        </div>
    </div>

    <script>
        // Utilizando a URL ativa do seu Web App
        const API_URL = "https://script.google.com/macros/s/AKfycbwehZdzJfw5V6tXZwpipmd8bCJWm8yYWBZt32hefUk0SweiRqGegkT8iEJ5JcBhYcoE/exec";

        // Variáveis de controle de estado
        let currentUser = null;
        let activeContact = null;
        let allContacts = [];
        let pollingInterval = null;
        let lastMessageCount = 0;

        // Controle de autenticação
        window.addEventListener("DOMContentLoaded", () => {
            currentUser = localStorage.getItem("usuario");
            const sector = localStorage.getItem("setor") || "Geral";

            if (!currentUser) {
                window.location.href = "login.html";
                return;
            }

            // Set my profile metadata
            document.getElementById("myUsername").textContent = currentUser;
            document.getElementById("mySector").textContent = sector;
            document.getElementById("myAvatar").textContent = currentUser.charAt(0).toUpperCase();

            // Load contact directory
            loadContacts();
        });

        // Toast de feedback
        function showToast(title, message, type = "success") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            const iconSvg = type === "success" 
                ? `<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`
                : `<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`;

            toast.innerHTML = `
                <div class="toast-icon">${iconSvg}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-msg">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("fadeOut");
                toast.addEventListener("animationend", () => toast.remove());
            }, 3500);
        }

        // Carrega os contatos (Envia text/plain para contornar CORS)
        async function loadContacts() {
            try {
                const req = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ acao: "listarContatos" })
                });
                
                const res = await req.json();

                if (res.erro) {
                    showToast("Erro no Servidor", res.erro, "error");
                    return;
                }

                allContacts = res.contatos || [];
                // Remove eu mesmo da lista de chat
                allContacts = allContacts.filter(c => c.nome.toLowerCase() !== currentUser.toLowerCase());
                
                renderContacts(allContacts);
            } catch (err) {
                console.error("Fetch contacts error:", err);
                showToast("Erro de Diretório", "Falha ao carregar a lista de contatos corporativos.", "error");
                
                document.getElementById("contactsContainer").innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); font-size: 13px; padding-top: 20px;">
                        Nenhum contato disponível
                    </div>
                `;
            }
        }

        // Renderiza os contatos
        function renderContacts(contacts) {
            const container = document.getElementById("contactsContainer");
            container.innerHTML = "";

            if (contacts.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 10px;">
                        Nenhum contato encontrado.
                    </div>
                `;
                return;
            }

            contacts.forEach(contact => {
                const initials = contact.nome ? contact.nome.charAt(0).toUpperCase() : "?";
                const activeClass = (activeContact && activeContact.nome.toLowerCase() === contact.nome.toLowerCase()) ? "active" : "";
                
                const contactDiv = document.createElement("div");
                contactDiv.className = `contact-item ${activeClass}`;
                contactDiv.onclick = () => selectContact(contact);
                
                contactDiv.innerHTML = `
                    <div class="contact-avatar">${initials}</div>
                    <div class="contact-details">
                        <div class="contact-name-wrapper">
                            <span class="contact-name">${contact.nome}</span>
                            <span class="contact-dept">${contact.setor || "Setor"}</span>
                        </div>
                    </div>
                `;
                container.appendChild(contactDiv);
            });
        }

        // Filtro de contatos na barra de pesquisa
        function filterContacts() {
            const query = document.getElementById("contactSearch").value.toLowerCase().trim();
            if (!query) {
                renderContacts(allContacts);
                return;
            }

            const filtered = allContacts.filter(c => 
                c.nome.toLowerCase().includes(query) || 
                (c.setor && c.setor.toLowerCase().includes(query))
            );
            renderContacts(filtered);
        }

        // Seleção do contato ativo
        function selectContact(contact) {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }

            activeContact = contact;
            lastMessageCount = 0; // Reseta o scroll na primeira carga

            renderContacts(allContacts);

            const chatArea = document.getElementById("chatArea");
            chatArea.innerHTML = `
                <div class="chat-active">
                    <!-- Top recipient header bar -->
                    <div class="chat-header">
                        <div class="chat-header-info">
                            <div class="chat-recipient-avatar">${contact.nome.charAt(0).toUpperCase()}</div>
                            <div>
                                <div class="chat-recipient-name">${contact.nome}</div>
                                <div class="chat-recipient-status">${contact.setor || 'Corporativo'}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Conversation messages list -->
                    <div class="chat-messages-board" id="msgBoard">
                        <div style="display: flex; justify-content: center; align-items: center; height: 100%;">
                            <div class="skeleton" style="width: 50px; height: 50px; border-radius: 50%;"></div>
                        </div>
                    </div>

                    <!-- Bottom message input bar -->
                    <div class="chat-input-controls">
                        <form onsubmit="handleSend(event)" class="input-bar-wrapper">
                            <input type="text" id="msgInput" placeholder="Digite uma mensagem segura para ${contact.nome}..." autocomplete="off">
                            <button type="submit" class="send-btn" title="Enviar Mensagem">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>
            `;

            syncMessages();

            // Polling dinâmico de 4 segundos
            pollingInterval = setInterval(syncMessages, 4000);
        }

        // Formatação de data
        function formatMessageDate(dateStr) {
            if (!dateStr) return "";
            try {
                const date = new Date(dateStr);
                return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return dateStr;
            }
        }

        // Sincroniza as mensagens (Envia text/plain para contornar CORS)
        async function syncMessages() {
            if (!activeContact) return;

            try {
                const req = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        acao: "buscarMensagens",
                        usuario: currentUser,
                        destinatario: activeContact.nome
                    })
                });

                const res = await req.json();

                if (res.erro) {
                    console.error("API error loading messages:", res.erro);
                    return;
                }

                const messages = res.mensagens || [];
                renderMessages(messages);
            } catch (err) {
                console.error("Message syncing error:", err);
            }
        }

        // Renderiza as mensagens na tela
        function renderMessages(messages) {
            const board = document.getElementById("msgBoard");
            if (!board) return;

            if (messages.length === 0) {
                board.innerHTML = `
                    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: var(--text-muted); font-size: 13.5px; gap: 8px;">
                        <div>💬 Nenhuma mensagem ainda</div>
                        <div style="font-size: 12px; opacity: 0.8;">Escreva uma mensagem abaixo para iniciar.</div>
                    </div>
                `;
                lastMessageCount = 0;
                return;
            }

            let contents = "";
            messages.forEach(msg => {
                const isSentByMe = msg.remetente.toLowerCase() === currentUser.toLowerCase();
                const rowClass = isSentByMe ? "msg-row-sent" : "msg-row-received";
                const bubbleClass = isSentByMe ? "msg-bubble-sent" : "msg-bubble-received";
                const time = formatMessageDate(msg.data);

                contents += `
                    <div class="msg-row ${rowClass}">
                        <div class="msg-bubble ${bubbleClass}">
                            <div class="msg-text">${escapeHtml(msg.mensagem)}</div>
                            <span class="msg-timestamp">${time}</span>
                        </div>
                    </div>
                `;
            });

            board.innerHTML = contents;

            // Rola para o fim se chegar mensagem nova
            if (messages.length > lastMessageCount) {
                board.scrollTop = board.scrollHeight;
                lastMessageCount = messages.length;
            }
        }

        // Envia mensagem (Envia text/plain para contornar CORS)
        async function handleSend(e) {
            e.preventDefault();
            if (!activeContact) return;

            const input = document.getElementById("msgInput");
            const text = input.value.trim();

            if (!text) return;

            input.value = "";

            try {
                const req = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        acao: "enviarMensagem",
                        remetente: currentUser,
                        destinatario: activeContact.nome,
                        mensagem: text
                    })
                });

                const res = await req.json();

                if (res.sucesso) {
                    syncMessages();
                } else {
                    showToast("Erro de envio", res.erro || "Falha desconhecida", "error");
                }
            } catch (err) {
                console.error("Sending message error:", err);
                showToast("Erro de Rede", "Sua mensagem não pôde ser enviada. Tente novamente.", "error");
            }
        }

        // Utilitário de escape de HTML contra XSS
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Logout
        function logout() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }
            localStorage.clear();
            showToast("Sessão Encerrada", "Você saiu com sucesso.", "success");
            setTimeout(() => {
                window.location.href = "login.html";
            }, 800);
        }
    </script>
</body>
</html>
